
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Devendra's Server Computation</title>
</head>
<body>
    <h1>Devendra Derangula uses a fetch request</h1>

    <label for="x">Enter X:</label>
    <input type="number" id="x" value="5">

    <br><br>

    <label for="y">Enter Y:</label>
    <input type="number" id="y" value="6">

    <br><br>

    <button onclick="invokeComputation()">
        Invoke computation on Server
    </button>

    <br><br>

    <div id="result"></div>

    <script>
        function invokeComputation() {
            const x = document.getElementById("x").value;
            const y = document.getElementById("y").value;
            const result = document.getElementById("result");

            if (x === "" || y === "") {
                result.textContent = "Please enter both numbers.";
                return;
            }

            const url = `http://127.0.0.1:3001/?x=${encodeURIComponent(x)}&y=${encodeURIComponent(y)}`;

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Server error: " + response.status);
                    }
                    return response.text();
                })
                .then(text => {
                    result.textContent = text;
                })
                .catch(error => {
                    result.textContent = "Error: " + error.message;
                });
        }
    </script>
</body>
</html>
